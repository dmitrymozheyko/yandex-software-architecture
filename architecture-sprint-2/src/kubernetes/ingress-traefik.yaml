apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cinemaabyss-ingress-secure
  namespace: cinemaabyss
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cinemaabyss.example.com`) && PathPrefix(`/api/events`)
      kind: Rule
      services:
        - name: events-service
          port: 8082
    - match: Host(`cinemaabyss.example.com`)
      kind: Rule
      services:
        - name: proxy-service
          port: 8000
      middlewares:
        - name: cinemaabyss-secureheaders
  tls:
    secretName: cinemaabyss-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cinemaabyss-ingress-unsecure
  namespace: cinemaabyss
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cinemaabyss.example.com`) && PathPrefix(`/api/events`)
      kind: Rule
      services:
        - name: events-service
          port: 8082
    - match: Host(`cinemaabyss.example.com`)
      kind: Rule
      services:
        - name: proxy-service
          port: 8000
#      middlewares:
#        - name: https-redirect
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cinemaabyss-secureheaders
  namespace: cinemaabyss
spec:
  headers:
    customRequestHeaders:
      X-Middleware-Header: "{{ .ClientIP }}"
    customResponseHeaders:
      Content-Security-Policy: "default-src 'self'; img-src 'self' data:;"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: cinemaabyss
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: websocket-headers
  namespace: cinemaabyss
spec:
  headers:
    customRequestHeaders:
      Upgrade: "WebSocket"
      Connection: "keep-alive, Upgrade"
      X-Forwarded-Proto: "https"
